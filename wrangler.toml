name = "zip-to-apk"
main = "worker/src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zip-to-apk"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[vars]
GH_OWNER = "your-github-username"
GH_REPO = "zip-to-apk-studio"
GH_REF = "main"
HOURLY_LIMIT = "5"
