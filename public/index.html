<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIP to APK Studio</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#d1d5db;--ac:#2563eb;--ok:#16a34a;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--ac:#60a5fa;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
main{width:100%;max-width:460px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:22px;margin:0 0 2px}p.sub{margin:0 0 16px;color:var(--mu);font-size:14px}
#drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:24px 12px;text-align:center;cursor:pointer}
#drop:hover{border-color:var(--ac)}#drop input{display:none}#fname{display:block;color:var(--mu);font-size:14px;margin-top:4px;word-break:break-all}
label.f{display:block;margin-top:12px;font-size:14px;color:var(--mu)}
input.t{width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx);font:inherit}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 16px system-ui;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#st{margin-top:16px}#bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}#fill{height:100%;width:0;background:var(--ac);transition:width .4s}
#msg{font-size:14px;margin-top:8px;color:var(--mu);white-space:pre-wrap;word-break:break-word}
.err{color:var(--er)!important}.ok{color:var(--ok)!important}
a.dl{display:block;margin-top:12px;padding:12px;text-align:center;border-radius:10px;background:var(--ok);color:#fff;text-decoration:none;font-weight:600}
small{display:block;margin-top:14px;color:var(--mu);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>ZIP to APK Studio</h1>
  <p class="sub">Upload an Android Studio project or a website (index.html) as a ZIP.</p>
  <label id="drop"><input id="file" type="file" accept=".zip"><b>Tap to choose a .zip</b><span id="fname">or drop it here</span></label>
  <label class="f">App name<input class="t" id="name" maxlength="30" placeholder="My App"></label>
  <label class="f">Package ID (optional)<input class="t" id="appId" placeholder="com.example.myapp" autocapitalize="none"></label>
  <label class="f" id="codeRow" hidden>Access code<input class="t" id="code" type="password"></label>
  <button id="go" disabled>Build APK</button>
  <div id="st" hidden><div id="bar"><div id="fill"></div></div><div id="msg"></div></div>
  <small>Builds a debug-signed APK. Only upload projects you trust.</small>
</main>
<script>
const $ = s => document.querySelector(s);
let file = null, maxMB = 25, timer = null;

fetch('/api/config').then(r => r.json()).then(c => {
  maxMB = c.maxMB; $('#codeRow').hidden = !c.codeRequired;
}).catch(() => {});

function show(text, cls, pct) {
  $('#st').hidden = false;
  const m = $('#msg'); m.textContent = text; m.className = cls || '';
  if (pct != null) $('#fill').style.width = pct + '%';
  $('#fill').style.background = cls === 'err' ? 'var(--er)' : cls === 'ok' ? 'var(--ok)' : 'var(--ac)';
}
function pick(f) {
  if (!f) return;
  if (!/\.zip$/i.test(f.name)) return show('Only .zip files are supported', 'err', 0);
  if (f.size > maxMB * 1048576) return show('File is too large (max ' + maxMB + ' MB)', 'err', 0);
  file = f; $('#go').disabled = false; $('#st').hidden = true;
  $('#fname').textContent = f.name + ' · ' + (f.size / 1048576).toFixed(1) + ' MB';
}
$('#file').addEventListener('change', e => pick(e.target.files[0]));
const drop = $('#drop');
drop.addEventListener('dragover', e => e.preventDefault());
drop.addEventListener('drop', e => { e.preventDefault(); pick(e.dataTransfer.files[0]); });

$('#go').addEventListener('click', () => {
  const fd = new FormData();
  fd.append('zip', file); fd.append('appName', $('#name').value);
  fd.append('appId', $('#appId').value); fd.append('code', $('#code').value);
  $('#go').disabled = true;
  const x = new XMLHttpRequest();
  x.open('POST', '/api/build');
  x.upload.onprogress = e => e.lengthComputable && show('Uploading… ' + Math.round(e.loaded / e.total * 100) + '%', '', 10 * e.loaded / e.total);
  x.onerror = () => { show('Network error', 'err', 0); $('#go').disabled = false; };
  x.onload = () => {
    let d = {}; try { d = JSON.parse(x.responseText); } catch {}
    if (x.status !== 200) { show(d.error || 'Upload failed', 'err', 0); $('#go').disabled = false; return; }
    poll(d.id);
  };
  x.send(fd);
});

function poll(id) {
  clearInterval(timer);
  const t0 = Date.now();
  const tick = async () => {
    try {
      const r = await fetch('/api/status/' + id); const s = await r.json();
      if (s.status === 'queued') show('Queued: ' + s.message, '', 25);
      else if (s.status === 'building') show('Building… (usually 2-5 min)', '', 60);
      else if (s.status === 'done') {
        clearInterval(timer); show('APK is ready', 'ok', 100); $('#go').disabled = false;
        const a = document.createElement('a'); a.className = 'dl'; a.href = s.download; a.textContent = 'Download APK';
        $('#st').appendChild(a);
      } else { clearInterval(timer); show('Build failed:\n' + s.message, 'err', 100); $('#go').disabled = false; }
    } catch {}
    if (Date.now() - t0 > 30 * 60000) { clearInterval(timer); show('Timed out', 'err'); $('#go').disabled = false; }
  };
  tick(); timer = setInterval(tick, 4000);
}
</script>
</body>
</html>
